name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  prepare:
    name: Prepare Image Name
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image_name.outputs.value }}

    steps:
      - name: Compute lowercase image name
        id: image_name
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/multimodal-api" >> "$GITHUB_OUTPUT"

  quality:
    name: Test (lite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (advisory, non-blocking)
        continue-on-error: true
        run: ruff check src tests

      - name: Run tests
        run: pytest -q

      - name: Validate notebook presence
        run: test -f notebooks/multimodal-classification.ipynb

  training_smoke:
    name: Train Smoke
    runs-on: ubuntu-latest
    needs: [quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training smoke
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.modeling.train import train_and_save_model

          has_csv = bool(list(Path("data/raw").glob("*.csv")) or list(Path("data").glob("*.csv")))
          if not has_csv:
              raise SystemExit("No CSV dataset found in data/raw or data")

          metadata = train_and_save_model()
          print("train smoke ok:", metadata.get("model_name"), metadata.get("scenario"))
          PY

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [prepare, quality, training_smoke]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f infra/docker/Dockerfile -t multimodal-api:ci .

  docker_publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [prepare, docker_build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_name }}:sha-${{ github.sha }}
            ${{ needs.prepare.outputs.image_name }}:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [prepare, docker_publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

    steps:
      - name: Deploy via webhook
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: |
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"image":"${{ needs.prepare.outputs.image_name }}:sha-${{ github.sha }}","sha":"${{ github.sha }}"}'

      - name: Skip deploy (no webhook configured)
        if: env.DEPLOY_WEBHOOK_URL == ''
        run: echo "DEPLOY_WEBHOOK_URL is not configured. Deployment skipped."
