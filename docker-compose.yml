services:
  mlflow:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: multimodal-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri file:///mlruns
      --default-artifact-root file:///mlruns
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "5000:5000"
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
    volumes:
      - ./mlruns:/mlruns

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: multimodal-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./mlruns:/app/mlruns
      - ./data:/app/data
    depends_on:
      - mlflow

  retrain-cron:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: multimodal-retrain-cron
    restart: unless-stopped
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./mlruns:/app/mlruns
      - ./data:/app/data
    depends_on:
      - api
    entrypoint: ["/bin/sh", "-c"]
    # Boucle toutes les 6h (cf. infra/cron/retrain.crontab) : pas de cron
    # daemon dans l'image slim, donc un simple sleep-loop suffit.
    command: >
      "while true; do
         python scripts/retrain_feedback.py --min-feedback 200;
         sleep 21600;
       done"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: multimodal-prometheus
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "9090:9090"
    volumes:
      - ./infra/compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.4
    container_name: multimodal-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/compose/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  grafana_data:
